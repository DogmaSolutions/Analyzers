# DogmaSolutions.Analyzers — full SSDLC pipeline (same method as DogmaSolutions.Foundation).
# Differences from Foundation: (1) build the NoVsix solution — the .Vsix project needs Visual Studio
# and can't build in the docker-windows toolchain; (2) tests are a single TFM (net9.0, MSTest), so a
# single `test` job replaces the per-.NET-version matrix (test-by-version.yml is NOT included);
# (3) it ships a NuGet analyzer package -> GitLab Package Registry (no nuget.org, per locked arch).
include:
  - project: 'global/ci-tools/ci-templates'
    ref: main
    file:
      - '/templates/workflow.yml'              # vars, GIT_CLONE_PATH (shared checkout), cache
      - '/templates/branch-rules.yml'          # GitFlow version rules
      - '/templates/quality-gates.yml'         # validate branch name / commit msg / stable packages
      - '/templates/checkout-and-build.yml'    # clone-ci-templates, clone-this, restore, build
      - '/templates/coverage.yml'              # merge-coverage + pages (HTML coverage -> GitLab Pages)
      - '/templates/sbom.yml'                  # generate-sbom (SPDX) in the 'sbom' stage
      - '/templates/security.yml'              # nuget-audit + OWASP dependency-check (pre/post deploy)
      - '/templates/deploy.yml'                # publish-nuget (-> GitLab registry) + git-tag
      - '/templates/git-notes.yml'             # record-ci-results-as-git-notes (.post): CI results as git notes
      - '/templates/signing.yml'               # verify-strong-name gate (+ opt-in Authenticode)

variables:
  CI_TEMPLATES_REF: 'main'
  # main is the active branch here (develop is stale); both map to the stable version rule.
  PACKAGE_VERSION_MAJOR_MINOR_DEVELOP: '1.2'
  PACKAGE_VERSION_MAJOR_MINOR_STABLE: '1.2'
  # Build the Vsix-less solution: the analyzer + package + tests + workbench, no VS-dependent .Vsix.
  SOLUTION_FILE: 'DogmaSolutions.Analyzers.NoVsix.sln'

stages:
  - pre-cleanup
  - pre-checkout-quality-gate
  - checkout-this
  - restore-this
  - build
  - post-build-security-gate
  - post-build-quality-gate
  - before-tests
  - test
  - after-tests
  - coverage-report
  - sbom
  - deploy
  - post-deploy-security-gate
  - pages
  # .post (git-notes record-ci-results-as-git-notes + cleanup) runs implicitly last

# ---- single test job (net9.0, MSTest) — analyzer tests are single-TFM, so no version matrix ----
test:
  stage: test
  tags: [windows]
  image: ci-toolchain:net9
  needs:
    - "build"
  variables:
    GIT_STRATEGY: none
  rules:
    - !reference [.branch_develop_rules, rules]
    - !reference [.branch_master_rules, rules]
    - !reference [.branch_release_rules, rules]
    - !reference [.branch_hotfix_rules, rules]
  script:
    - |
        & "$env:CI_SCRIPTS_DIR/RunSolutionTests.ps1" -Solution $env:SOLUTION_FILE -Framework net9.0 -Label all -CoverageReportsDir $env:COVERAGE_REPORTS_DIR -PipelineId $env:CI_PIPELINE_ID
  coverage: '/Line coverage:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    paths:
      - "coverage-reports/net9.0/all/**/coverage.cobertura.xml"
    reports:
      junit:
        - "coverage-reports/net9.0/all/**/*.junit.xml"

# ---- volatile shared-dir cleanup (robocopy = long-path safe); runs last, always ----
cleanup:
  stage: .post
  tags: [windows]
  image: ci-toolchain:net8
  variables:
    GIT_STRATEGY: none
  # must run AFTER record-ci-results-as-git-notes: cleanup wipes C:\builds\<pid> (which holds the sibling
  # ci-templates checkout that record-ci-results-as-git-notes needs). The job was renamed from 'combine-notes';
  # the stale reference made this optional need never match, so cleanup DAG-jumped to the front and wiped the
  # shared checkout mid-pipeline. optional -> still runs if record-ci-results-as-git-notes is skipped.
  needs:
    - job: record-ci-results-as-git-notes
      optional: true
  allow_failure: true
  rules:
    - when: always
  script:
    - |
        $t = "C:\builds\$env:CI_PIPELINE_ID"
        if (Test-Path $t) {
          $e = "C:\_empty_$env:CI_PIPELINE_ID"; New-Item $e -ItemType Directory -Force | Out-Null
          robocopy $e $t /MIR /R:0 /W:0 /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
          Remove-Item $t -Force -Recurse -ErrorAction SilentlyContinue
          Remove-Item $e -Force -Recurse -ErrorAction SilentlyContinue
        }
        Write-Host "cleaned $t (FreeGB now $([math]::Round((Get-PSDrive C).Free/1GB,1)))"
        exit 0